name: Refresh IGP Seismic Feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingestor
        env:
          IGP_HISTORICAL_SOURCE_URL: ${{ vars.IGP_HISTORICAL_SOURCE_URL }}
          IGP_HISTORICAL_REFRESH_HOURS: ${{ vars.IGP_HISTORICAL_REFRESH_HOURS }}
          IGP_PREVIEW_ROWS: ${{ vars.IGP_PREVIEW_ROWS }}
        run: |
          if [ -n "${IGP_HISTORICAL_SOURCE_URL:-}" ]; then
            python3 seismic_bi_stream/igp_seismic_stream.py \
              --historical-source "${IGP_HISTORICAL_SOURCE_URL}"
          else
            python3 seismic_bi_stream/igp_seismic_stream.py
          fi

      - name: Commit updated feed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seismic_bi_stream/data/state.json
          git add seismic_bi_stream/exports/earthquakes_live.csv
          git add seismic_bi_stream/exports/earthquakes_live_curated.csv
          git add seismic_bi_stream/exports/earthquakes_live_preview.csv
          git add seismic_bi_stream/exports/earthquakes_live.geojson
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh IGP seismic feed"
            git push
          fi
